[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "process-spine"
version = "0.1.0"
description = "Bayesian experimental design on measured process tables -- no simulator in the loop"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Yangyi Zhang", url = "https://github.com/ZhangYangyi03"}]
keywords = ["bayesian-optimization", "experimental-design", "process-optimization",
            "surrogate-model", "high-throughput-experimentation", "reproducible"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ZhangYangyi03/process-spine"
Source = "https://github.com/ZhangYangyi03/process-spine"

[tool.setuptools]
packages = ["pspine"]

[tool.setuptools.package-data]
pspine = ["_datasets/buchwald/*.csv", "_datasets/buchwald/*.txt"]
