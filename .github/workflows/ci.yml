name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests -q
      - name: The data is the data
        run: python -m pspine space
      - name: Every table a campaign runs on is complete, and hash-verified
        shell: bash
        run: |
          python -m pspine space | tee space.txt
          python - <<'EOF'
          import re, sys
          txt = open("space.txt").read()
          tables = re.findall(r"^== (\w+)", txt, re.M)
          assert len(tables) == 4, f"expected 4 tables, saw {tables}"
          assert txt.count("verified         True") == 4, "a table failed its pinned hash"
          for bad in ("verified         False",):
              assert bad not in txt
          print("4 tables, all verified, all loaded")
          EOF
      - name: A campaign on every table, all arms, so the ceiling is on the record
        shell: bash
        run: python bench/run_multitable.py --seeds 1 --budget 16 --tables ccpp,concrete --out bench/ci_mt.json
      - name: The continuous kernel must beat the binned one
        shell: bash
        run: python bench/run_top10.py --seeds 1 --sizes 32 --tables concrete --out bench/ci_t10.json
      - name: A campaign runs end to end
        shell: bash
        run: python bench/run_campaign.py --seeds 1 --budget 16 --acqs ei --out bench/ci.json
      - name: Upload the campaign results
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            bench/ci.json
            bench/ci_mt.json
            bench/ci_t10.json
            space.txt

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a wheel and install it into a clean venv
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import pspine; print(pspine.__version__)"
          cd /tmp && /tmp/clean/bin/python -c "from pspine import data; s,c,y,m=data.buchwald(); print(s, m['rows'])"
