name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests -q
      - name: The data is the data
        run: python -m pspine space
      - name: A campaign runs end to end
        shell: bash
        run: python bench/run_campaign.py --seeds 1 --budget 16 --acqs ei --out bench/ci.json
      - name: Upload the campaign result
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}-${{ matrix.python-version }}
          path: bench/ci.json

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a wheel and install it into a clean venv
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import pspine; print(pspine.__version__)"
          cd /tmp && /tmp/clean/bin/python -c "from pspine import data; s,c,y,m=data.buchwald(); print(s, m['rows'])"
